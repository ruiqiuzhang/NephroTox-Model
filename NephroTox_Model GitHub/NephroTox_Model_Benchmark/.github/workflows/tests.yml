name: repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate curated release
        run: python scripts/validate_release.py

  traditional-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: traditional_models/requirements.txt
      - name: Install traditional-model package
        run: python -m pip install -e traditional_models pytest
      - name: Run unit tests
        run: python -m pytest traditional_models/tests

